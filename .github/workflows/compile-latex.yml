name: Compile LaTeX Report

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install TeX Live
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-lang-french \
            texlive-science \
            lmodern \
            cm-super

      - name: Compile LaTeX (pass 1)
        run: pdflatex -interaction=nonstopmode -halt-on-error main.tex

      - name: Compile LaTeX (pass 2 — TOC & refs)
        run: pdflatex -interaction=nonstopmode main.tex

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartFood-Rapport-PDF
          path: main.pdf
          retention-days: 30

      - name: Confirm success
        run: |
          SIZE=$(du -sh main.pdf | cut -f1)
          echo "Compilation reussie — main.pdf ($SIZE)"
