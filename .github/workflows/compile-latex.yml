name: Compile LaTeX Report

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install TeX Live packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-lang-french \
            texlive-science \
            texlive-pictures \
            lmodern \
            cm-super

      - name: Compile LaTeX pass 1
        run: |
          pdflatex -interaction=nonstopmode main.tex || true

      - name: Compile LaTeX pass 2
        run: |
          pdflatex -interaction=nonstopmode main.tex || true

      - name: Verify PDF
        run: |
          if [ -f main.pdf ]; then
            SIZE=$(du -sh main.pdf | cut -f1)
            echo "PDF genere : $SIZE"
          else
            echo "ERREUR : main.pdf absent"
            cat main.log | tail -50
            exit 1
          fi

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartFood-Rapport-PDF
          path: main.pdf
          retention-days: 30
